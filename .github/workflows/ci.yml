name: CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: set up node
        uses: actions/setup-node@v3
        with:
          node-version: '24'
      - name: install dependencies
        run: npm ci
      - name: check types
        run: tsc --noEmit
      - name: run linting
        run: eslint . --fix
